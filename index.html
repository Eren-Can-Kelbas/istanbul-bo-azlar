<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>İstanbul Rota | İnteraktif Harita</title>
  <meta name="description" content="Tam ekran, popup pencereli interaktif İstanbul rota haritası.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app">

    <section class="stage">
      <div class="mapWrap">
        <img src="assets/images/rota-haritasi.png" alt="İstanbul keşif rotası haritası" class="mapImage">
        <div class="hotspots" aria-label="Tıklanabilir rota durakları">
          <button class="map-hotspot" style="--x:73.05%;--y:29.02%;--size:5.2vw;" data-stop="fsm" aria-label="FSM Köprüsü"></button>
          <button class="map-hotspot" style="--x:32.57%;--y:12.76%;--size:5.2vw;" data-stop="belgrad" aria-label="Belgrad Ormanı"></button>
          <button class="map-hotspot" style="--x:25.31%;--y:42.14%;--size:5.2vw;" data-stop="arboretum" aria-label="Atatürk Arboretumu"></button>
          <button class="map-hotspot" style="--x:45.79%;--y:38.47%;--size:5.2vw;" data-stop="rumeli" aria-label="Rumeli Hisarı"></button>
          <button class="map-hotspot" style="--x:53.2%;--y:69.03%;--size:5.2vw;" data-stop="bebek" aria-label="Bebek Sahili"></button>
          <button class="map-hotspot" style="--x:64.86%;--y:50.16%;--size:5.2vw;" data-stop="anadolu" aria-label="Anadolu Hisarı"></button>
          <button class="map-hotspot" style="--x:89.1%;--y:66.7%;--size:7.6vw;" data-stop="cekmekoy" aria-label="Çekmeköy"></button>
        </div>
      </div>

      <section id="localMusicPlayer" class="localMusicPlayer" aria-label="Rota müziği oynatıcı">
        <video id="routeAudio" class="hiddenMedia" preload="metadata" playsinline></video>

        <button id="playerMiniButton" class="playerMiniButton" type="button" aria-label="Rota müziği panelini aç veya kapat">
          <span class="miniDisc">
            <img id="miniCover" src="" alt="">
          </span>
          <span class="miniText">
            <strong>Rota Müziği</strong>
            <small id="miniTrackName">Şarkı seçili</small>
          </span>
        </button>

        <aside id="playerPanel" class="playerPanel" aria-hidden="true">
          <div class="playerHeader">
            <div>
              <span class="playerKicker">Sunum Müziği</span>
              <h2>Rota Müziği</h2>
            </div>
            <button id="playerClose" class="playerClose" type="button" aria-label="Müzik panelini kapat">×</button>
          </div>

          <div class="nowPlaying">
            <div class="coverBox">
              <img id="playerCover" src="" alt="Şarkı kapak görseli">
            </div>

            <div class="trackInfo">
              <strong id="trackTitle">Şarkı adı</strong>
              <span id="trackArtist">Sanatçı</span>
            </div>
          </div>

          <div class="progressBlock">
            <input id="progressRange" class="progressRange" type="range" min="0" max="100" value="0" step="0.1" aria-label="Şarkı ilerleme çubuğu">
            <div class="timeRow">
              <span id="currentTime">0:00</span>
              <span id="durationTime">0:00</span>
            </div>
          </div>

          <div class="controlRow">
            <button id="prevTrack" class="circleControl" type="button" aria-label="Önceki şarkı">‹</button>
            <button id="playPause" class="playControl" type="button" aria-label="Oynat veya duraklat">▶</button>
            <button id="nextTrack" class="circleControl" type="button" aria-label="Sonraki şarkı">›</button>
          </div>

          <div class="volumeRow">
            <span>Ses</span>
            <input id="volumeRange" class="volumeRange" type="range" min="0" max="1" value="0.45" step="0.01" aria-label="Ses seviyesi">
            <button id="loopToggle" class="loopToggle active" type="button" aria-label="Döngüyü aç veya kapat">Loop açık</button>
          </div>

          <div class="trackList" id="trackList" aria-label="Şarkı listesi"></div>

          <p class="playerNote">
            Sayfaya ilk tıklamada müzik başlatılır. Tarayıcı engellerse play tuşuna basman yeterli.
          </p>
        </aside>
      </section>

    </section>

    <div id="infoModal" class="infoModal" aria-hidden="true">
      <div class="modalBackdrop" data-close="true"></div>
      <section class="modalPanel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="closeBtn" type="button" aria-label="Kapat">×</button>
        <div id="dialogContent"></div>
      </section>
    </div>
  </main>

  <script>
    window.ROUTE_STOPS = [{"id": "fsm", "title": "FSM Köprüsü", "subtitle": "Boğaz geçişinin modern simgesi", "routeOrder": "Rota sırası: 2. durak, dönüşte FSM hattı yeniden hatırlanır", "category": "Mavi Hafıza", "tags": ["Boğaz", "Geçiş", "Köprü", "Manzara"], "text": "FSM Köprüsü, Anadolu Yakası ile Avrupa Yakası arasındaki geçişi temsil eder. Bu durak, rotanın mavi hafızasını ve Boğaz’ın bağlayıcı gücünü görünür kılar.", "note": "FSM Köprüsü, iki kıtayı yalnızca fiziksel olarak değil, kültürel olarak da birbirine bağlayan modern bir eşiktir.", "x": 73.05, "y": 29.02, "size": 5.2, "photos": ["assets/images/fsm-gidis/1.webp", "assets/images/fsm-gidis/2.webp", "assets/images/fsm-donus/1.webp", "assets/images/fsm-donus/2.webp"]}, {"id": "belgrad", "title": "Belgrad Ormanı", "subtitle": "Kentin yeşil nefesi", "routeOrder": "Rota sırası: 3. durak", "category": "Yeşil Hafıza", "tags": ["Orman", "Doğa", "Sessizlik", "Yürüyüş"], "text": "Belgrad Ormanı, İstanbul’un yoğun şehir dokusu içinde doğanın korunduğu en önemli alanlardan biridir. Sessizlik, yürüyüş ve ağaç dokusu burada öne çıkar.", "note": "Boğaz maviyse, Belgrad Ormanı İstanbul’un derin yeşilidir.", "x": 32.57, "y": 12.76, "size": 5.2, "photos": ["assets/images/belgrad/1.webp", "assets/images/belgrad/2.webp"]}, {"id": "arboretum", "title": "Atatürk Arboretumu", "subtitle": "Yaşayan ağaç müzesi", "routeOrder": "Rota sırası: 4. durak", "category": "Yeşil Hafıza", "tags": ["Arboretum", "Bitki Çeşitliliği", "Doğa", "Gölet"], "text": "Atatürk Arboretumu, doğanın sadece bir manzara değil, korunması gereken canlı bir arşiv olduğunu gösterir. Bitki çeşitliliği ve düzenli peyzajıyla eşsiz bir çalışma ve gezi alanıdır.", "note": "Arboretum, İstanbul’un kendi içine çekildiği genetik hafızasıdır.", "x": 25.31, "y": 42.14, "size": 5.2, "photos": ["assets/images/arboretum/1.webp", "assets/images/arboretum/2.webp", "assets/images/arboretum/3.webp"]}, {"id": "rumeli", "title": "Rumeli Hisarı", "subtitle": "Boğaz’ın tarihî eşiği", "routeOrder": "Rota sırası: 5. durak", "category": "Tarih Hafızası", "tags": ["Tarih", "Hisar", "Boğaz", "Miras"], "text": "Rumeli Hisarı, Boğaz’ın tarihî savunma ve geçiş hafızasını yansıtır. Bu durak, İstanbul’un yalnızca doğal değil aynı zamanda güçlü bir tarih katmanına sahip olduğunu gösterir.", "note": "Rumeli Hisarı, Boğaz’ın tarih ve güç hafızasını görünür kılar.", "x": 45.79, "y": 38.47, "size": 5.2, "photos": ["assets/images/rumeli/1.webp"]}, {"id": "bebek", "title": "Bebek Sahili", "subtitle": "Boğaz kıyısında gündelik yaşam", "routeOrder": "Rota sırası: 6. durak", "category": "Mavi Hafıza", "tags": ["Sahil", "Boğaz", "Sosyal Yaşam", "Kıyı"], "text": "Bebek Sahili, Boğaz manzarasının İstanbul gündelik yaşamıyla buluştuğu canlı kıyı duraklarından biridir. Deniz, yürüyüş ve sosyal yaşam burada iç içedir.", "note": "Bebek’te Boğaz yalnızca izlenen bir manzara değil, yaşanan bir şehir ritmidir.", "x": 53.2, "y": 69.03, "size": 5.2, "photos": ["assets/images/bebek/1.webp", "assets/images/bebek/2.webp"]}, {"id": "anadolu", "title": "Anadolu Hisarı", "subtitle": "Boğaz’ın sakin yüzü", "routeOrder": "Rota sırası: 8. durak", "category": "Tarih + Mavi Hafıza", "tags": ["Hisar", "Sakinlik", "Boğaz", "Kültür"], "text": "Anadolu Hisarı, Boğaz’ın daha sakin, daha korunaklı ve daha içe dönük tarafını temsil eder. Rumeli Hisarı ile birlikte Boğaz’ın karşılıklı tarihî hafızasını tamamlar.", "note": "Anadolu Hisarı, Boğaz’ın korunaklı ve sakin cildi gibidir.", "x": 64.86, "y": 50.16, "size": 5.2, "photos": ["assets/images/anadolu/1.webp", "assets/images/anadolu/2.webp"]}, {"id": "cekmekoy", "title": "Çekmeköy", "subtitle": "Başlangıç ve kapanış noktası", "routeOrder": "Rota sırası: 1. durak ve kapanış noktası", "category": "Başlangıç Noktası", "tags": ["Başlangıç", "Kapanış", "Kent Yaşamı", "Rota"], "text": "Rota Çekmeköy’den başlar ve yine Çekmeköy’de sona erer. Böylece İstanbul’un gündelik yaşam alanından başlayıp doğa, tarih ve Boğaz üzerinden tamamlanan döngüsel bir anlatı kurulmuş olur.", "note": "Başladığımız yere dönerken İstanbul’u artık yalnızca bir megakent olarak değil, mavi ve yeşil hafızasıyla okuyoruz.", "x": 89.1, "y": 66.7, "size": 7.6, "photos": ["assets/images/cekmekoy/1.webp", "assets/images/cekmekoy/2.webp", "assets/images/cekmekoy/3.webp", "assets/images/cekmekoy/4.webp", "assets/images/cekmekoy-donus/1.webp", "assets/images/cekmekoy-donus/2.webp", "assets/images/cekmekoy-donus/3.webp"]}];
  </script>
  <script>
    window.LOCAL_MUSIC_TRACKS = [{"title": "Burası İstanbul", "artist": "Nil Karaibrahimgil", "src": "assets/music/nil-burasi-istanbul.mp4", "cover": "assets/music/covers/burasi-istanbul.png"}, {"title": "İstanbul Kafası", "artist": "Dolunay Obruk", "src": "assets/music/dolunay-istanbul-kafasi.mp4", "cover": "assets/music/covers/dolunay-obruk.png"}, {"title": "Istanbul", "artist": "The Four Lads", "src": "assets/music/four-lads-istanbul.mp4", "cover": "assets/music/covers/the-four-lads.png"}];
  </script>
  <script src="js/script.js"></script>
</body>
</html>
